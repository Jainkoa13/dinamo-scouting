kind = "web"
previewPath = "/dinamo-apk/"
title = "DI Scouting APK"
version = "1.0.0"
id = "artifacts/dinamo-apk"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/dinamo-apk/" ]
localPort = 19762

[services.development]
run = "pnpm --filter @workspace/dinamo-apk run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dinamo-apk", "run", "build" ]
publicDir = "artifacts/dinamo-apk/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19762"
BASE_PATH = "/dinamo-apk/"
